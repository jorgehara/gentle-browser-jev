<!doctype html><html><head><meta charset="utf-8"><title>Gentle Browser JEV</title><style>body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 18px;background:#17131a;color:#f8edf5}button{padding:9px;background:#d66b9b;color:#fff;border:0;border-radius:5px}#metrics{display:flex;gap:12px;flex-wrap:wrap}.card{background:#271f29;border-radius:6px;padding:12px;min-width:130px}pre{white-space:pre-wrap;background:#211a23;padding:12px;max-height:500px;overflow:auto}</style></head><body><h1>Gentle Browser JEV</h1><p>Live separation of Gentle decisions, JEV decisions, browser actions, latency, tokens and stop gates.</p><input id="goal" value="Find the search control" size="45"><button id="run">Run task</button> <button id="download">Download report</button><div id="metrics"></div><h2>Live trace</h2><pre id="trace">Waiting for a run…</pre><script>const events=[]; const runButton=document.getElementById('run'); const downloadButton=document.getElementById('download'); const goalInput=document.getElementById('goal'); const metricsPanel=document.getElementById('metrics'); const tracePanel=document.getElementById('trace'); const es=new EventSource('/events'); es.onmessage=e=>{events.push(JSON.parse(e.data)); render()}; es.onerror=()=>{tracePanel.textContent='Event stream disconnected. Keep the server running and reload.'}; runButton.onclick=async()=>{tracePanel.textContent='Starting run…'; try { const response=await fetch('/api/run',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({goal:goalInput.value})}); if(!response.ok) throw new Error('HTTP '+response.status); await response.json(); } catch(error) { tracePanel.textContent='Run failed: '+error.message; }}; downloadButton.onclick=()=>{const last=events.at(-1)?.runId;if(last) location.href='/api/report/'+last}; function render(){const r=events.at(-1);const jev=events.filter(e=>e.owner==='jev').reduce((n,e)=>n+(e.durationMs||0),0);const gentle=events.filter(e=>e.owner==='gentle').reduce((n,e)=>n+(e.durationMs||0),0);const tokens=events.reduce((a,e)=>({input:a.input+(e.inputTokens||0),output:a.output+(e.outputTokens||0)}),{input:0,output:0});metricsPanel.innerHTML=[['JEV ms',jev.toFixed(1)],['Gentle ms',gentle.toFixed(1)],['Input tokens',tokens.input],['Output tokens',tokens.output],['JEV calls',events.filter(e=>e.owner==='jev').length]].map(x=>`<div class="card"><b>${x[0]}</b><br>${x[1]}</div>`).join('');tracePanel.textContent=events.map(e=>JSON.stringify(e)).join('\n');}</script></body></html>
